name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "VPS_HOST / VPS_SSH_KEY не заданы — деплой пропущен."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          request_pty: true
          envs: PTO_APP_DIR,PTO_DOMAIN
          script: |
            set -euo pipefail
            APP_DIR="${PTO_APP_DIR:-/var/www/pto}"
            APP_USER="${PTO_APP_USER:-pto}"
            echo "[gha] start deploy in $APP_DIR"
            # Снять зависший npm/next от прошлого обрыва SSH.
            pkill -u "$APP_USER" -f "npm|next" 2>/dev/null || true
            sleep 1
            cd "$APP_DIR"
            if id -u "$APP_USER" >/dev/null 2>&1 && [[ "$(id -un)" != "$APP_USER" ]]; then
              sudo -u "$APP_USER" git fetch --all --prune
              sudo -u "$APP_USER" git reset --hard origin/main
            else
              git fetch --all --prune
              git reset --hard origin/main
            fi
            echo "[gha] tree $(git rev-parse --short HEAD)"
            chmod +x "$APP_DIR/scripts/"*.sh 2>/dev/null || true
            export PTO_APP_DIR="$APP_DIR"
            bash "$APP_DIR/scripts/deploy-remote.sh"
            if [[ -n "${PTO_DOMAIN:-}" ]] && [[ -f "$APP_DIR/scripts/enable-ssl.sh" ]]; then
              bash "$APP_DIR/scripts/enable-ssl.sh" "$PTO_DOMAIN" \
                || sudo bash "$APP_DIR/scripts/enable-ssl.sh" "$PTO_DOMAIN"
            elif [[ -f "$APP_DIR/scripts/enable-ssl-selfsigned.sh" ]]; then
              bash "$APP_DIR/scripts/enable-ssl-selfsigned.sh" \
                || sudo bash "$APP_DIR/scripts/enable-ssl-selfsigned.sh"
            fi
            echo "[gha] deploy finished"
        env:
          PTO_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          PTO_DOMAIN: ${{ vars.PTO_DOMAIN }}

