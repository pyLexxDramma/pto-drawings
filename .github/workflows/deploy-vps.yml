name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "VPS_HOST / VPS_SSH_KEY не заданы — деплой пропущен."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: PTO_APP_DIR
          script: |
            set -euo pipefail
            APP_DIR="${PTO_APP_DIR:-/var/www/pto}"
            chmod +x "$APP_DIR/scripts/"*.sh 2>/dev/null || true
            export PTO_APP_DIR="$APP_DIR"
            bash "$APP_DIR/scripts/deploy-remote.sh"
        env:
          PTO_APP_DIR: ${{ secrets.VPS_APP_DIR }}

