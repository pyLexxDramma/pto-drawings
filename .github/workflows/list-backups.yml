name: List backups (one-shot)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/list-backups.yml"

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List backups and recent uploads on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 3m
          envs: PTO_APP_DIR
          script: |
            set +e
            APP_DIR="${PTO_APP_DIR:-/var/www/pto}"
            echo "=== APP_DIR=$APP_DIR ==="
            ls -la "$APP_DIR/data" 2>&1 | head -40
            echo "=== /var/lib/pto ==="
            ls -la /var/lib/pto 2>&1 | head -40
            echo "=== uploads count ==="
            find /var/lib/pto/uploads -type f 2>/dev/null | wc -l
            echo "=== recent upload files ==="
            find /var/lib/pto/uploads -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -25
            echo "=== data json files ==="
            find "$APP_DIR/data" /var/lib/pto -maxdepth 4 -name '*.json' 2>/dev/null | head -40
            echo "=== db dump ==="
            cat > /tmp/pto_list_db.py << 'PY'
            import json, os
            paths = [
              "/var/www/pto/data/db.json",
              "/var/www/pto/data/index.json",
              "/var/lib/pto/data/db.json",
            ]
            for p in paths:
              if not os.path.isfile(p):
                continue
              print("FOUND", p)
              db = json.load(open(p, encoding="utf-8"))
              print("projects", [(x.get("name"), x.get("id")) for x in db.get("projects", [])])
              docs = sorted(db.get("documents", []), key=lambda d: d.get("createdAt", ""), reverse=True)
              print("docs", len(docs))
              for d in docs[:25]:
                print(d.get("createdAt"), "|", d.get("originalName"), "|", d.get("storedName"), "|", d.get("id"), "|", d.get("status"))
            PY
            python3 /tmp/pto_list_db.py
            echo "=== zip backups ==="
            find /var/www /opt /var/lib/pto /root /home -maxdepth 4 \( -name 'pto-*.zip' -o -name 'backup*.zip' -o -name 'data*.tar*' \) 2>/dev/null | head -30
            echo "=== done ==="
        env:
          PTO_APP_DIR: ${{ secrets.VPS_APP_DIR }}
