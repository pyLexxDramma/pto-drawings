name: List backups (one-shot)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/list-backups.yml"

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deep search leftover files on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            set +e
            echo "=== find pdf/dwg anywhere under pto ==="
            find /var/lib/pto /var/www/pto /opt/pto /tmp -type f \( -iname '*.pdf' -o -iname '*.dwg' -o -iname '*.docx' -o -iname '*.doc' \) 2>/dev/null | head -50
            echo "=== docker volumes ==="
            docker volume ls 2>/dev/null
            docker ps -a --format '{{.Names}}' 2>/dev/null
            for c in $(docker ps -aq 2>/dev/null); do echo "-- $c"; docker inspect "$c" --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' 2>/dev/null; done
            echo "=== search IOS2 / Жуковский names ==="
            find / -iname '*IOS*' 2>/dev/null | head -20
            find / -iname '*ИОС*' 2>/dev/null | head -20
            find / -iname '*Zhukov*' 2>/dev/null | head -20
            find / -iname '*Жуков*' 2>/dev/null | head -20
            echo "=== db.json size / mtime ==="
            ls -la /var/lib/pto/data/
            echo "=== journal / snapshots ==="
            ls /var/lib/pto/data/*.bak /var/lib/pto/data/*~ /var/lib/pto/data/*.old 2>/dev/null
            ls /var/lib/systemd/coredump 2>/dev/null | head
            echo "=== done ==="
