name: List backups (one-shot)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List backups and recent uploads on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 3m
          script: |
            set -euo pipefail
            APP_DIR="${PTO_APP_DIR:-/var/www/pto}"
            echo "=== APP_DIR=$APP_DIR ==="
            ls -la "$APP_DIR/backups" 2>/dev/null || echo "no backups/"
            echo "=== uploads count ==="
            ls "$APP_DIR/uploads" 2>/dev/null | wc -l || true
            echo "=== recent uploads ==="
            ls -lt "$APP_DIR/uploads" 2>/dev/null | head -20 || true
            echo "=== data docs ==="
            ls -lt "$APP_DIR/data/documents" 2>/dev/null | head -20 || true
            echo "=== projects in index ==="
            python3 - <<'PY'
            import json, pathlib
            p = pathlib.Path("/var/www/pto/data/db.json")
            if not p.exists():
                p = pathlib.Path("/var/www/pto/data/index.json")
            print("index:", p)
            if p.exists():
                db = json.loads(p.read_text(encoding="utf-8"))
                print("projects:", [(x.get("name"), x.get("id")) for x in db.get("projects", [])])
                docs = db.get("documents", [])
                docs = sorted(docs, key=lambda d: d.get("createdAt",""), reverse=True)
                for d in docs[:15]:
                    print(d.get("createdAt"), d.get("originalName"), d.get("projectId"), d.get("id"), d.get("status"))
            else:
                print("no index")
            PY
            echo "=== other backup candidates ==="
            ls -lt /var/backups 2>/dev/null | head -10 || true
            ls -lt /opt/pto/backups 2>/dev/null | head -10 || true
            find /var/www/pto /opt/pto -maxdepth 3 -name 'pto-*.zip' 2>/dev/null | head -20 || true
        env:
          PTO_APP_DIR: ${{ secrets.VPS_APP_DIR }}
