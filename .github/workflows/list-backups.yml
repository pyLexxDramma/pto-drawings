name: List backups (one-shot)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/list-backups.yml"

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect bak and hunt stored files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            set +e
            echo "=== data dir ==="
            ls -la /var/lib/pto/data/
            echo "=== bak projects/docs ==="
            python3 - <<'PY'
            import json
            p='/var/lib/pto/data/db.json.bak-names-20260908'
            db=json.load(open(p,encoding='utf-8'))
            print('projects',[(x.get('name'),x.get('id')) for x in db.get('projects',[])])
            docs=sorted(db.get('documents',[]), key=lambda d:d.get('createdAt',''), reverse=True)
            print('docs',len(docs))
            for d in docs[:30]:
              print(d.get('createdAt'),'|',d.get('originalName'),'|',d.get('storedName'),'|',d.get('id'),'|',d.get('projectId'))
            open('/tmp/pto_stored_names.txt','w',encoding='utf-8').write('\n'.join(d.get('storedName') or '' for d in docs))
            open('/tmp/pto_doc_ids.txt','w',encoding='utf-8').write('\n'.join(d.get('id') or '' for d in docs))
            PY
            echo "=== hunt storedName files ==="
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              find /var/lib/pto /var/www/pto /opt/pto /tmp /root -name "$name" 2>/dev/null
            done < /tmp/pto_stored_names.txt | head -40
            echo "=== hunt doc json bodies ==="
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              find /var/lib/pto /var/www/pto -name "$id.json" 2>/dev/null
            done < /tmp/pto_doc_ids.txt | head -40
            echo "=== samples ==="
            ls -la /var/www/pto/samples/
            echo "=== done ==="
