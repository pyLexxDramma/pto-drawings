name: Pause pipeline

on:
  workflow_dispatch:

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check secrets
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop pipeline, keep site
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 5m
          request_pty: true
          envs: PTO_APP_DIR
          script: |
            APP_DIR="${PTO_APP_DIR:-/var/www/pto}"
            ENV_FILE="$APP_DIR/.env.local"
            echo "[pause] host $(hostname) dir $APP_DIR"
            mkdir -p "$APP_DIR"
            touch "$ENV_FILE"
            grep -q '^PTO_PAUSE_PROCESSING=' "$ENV_FILE" && sed -i 's/^PTO_PAUSE_PROCESSING=.*/PTO_PAUSE_PROCESSING=1/' "$ENV_FILE" || echo 'PTO_PAUSE_PROCESSING=1' >> "$ENV_FILE"
            echo "[pause] env set"
            systemctl stop pto-pipeline || true
            systemctl stop pto-backend || true
            systemctl stop pto-work || true
            docker ps --format '{{.Names}}' | grep -Ei 'pto|pipeline|backend|pto-work' | xargs -r docker stop || true
            systemctl restart pto || true
            systemctl is-active pto || true
            free -h
        env:
          PTO_APP_DIR: ${{ secrets.VPS_APP_DIR }}
