name: Cloud.ru Artifact Registry

on:
  push:
    branches: [main]

env:
  CR_URI: ${{ vars.CR_URI }}
  IMAGE: pto-drawings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloud.ru settings
        run: |
          if [ -z "${{ vars.CR_URI }}" ]; then
            echo "Задайте переменную репозитория CR_URI: имя.cr.cloud.ru"
            exit 1
          fi
          if [ -z "${{ secrets.EVO_CR_LOGIN }}" ] || [ -z "${{ secrets.EVO_CR_PWD }}" ]; then
            echo "Задайте секреты EVO_CR_LOGIN и EVO_CR_PWD из ключа Artifact Registry"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.CR_URI }}
          username: ${{ secrets.EVO_CR_LOGIN }}
          password: ${{ secrets.EVO_CR_PWD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.CR_URI }}/${{ env.IMAGE }}:latest
            ${{ env.CR_URI }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
