name: Deploy CloudPub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Pull and publish
        shell: powershell
        run: |
          $prod = "D:\PTO\pto-prod"
          if (-not (Test-Path "$prod\.git")) {
            git clone "https://github.com/pyLexxDramma/pto-drawings.git" $prod
          }
          Set-Location $prod
          git fetch origin
          git reset --hard origin/main
          $env:PTO_APP_DIR = $prod
          powershell -ExecutionPolicy Bypass -File "$prod\scripts\deploy-cloudpub.ps1"
