name: Deploy CloudPub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Pull and serve live
        shell: powershell
        run: |
          $app = "D:\PTO\pto-app"
          if (-not (Test-Path "$app\.git")) {
            git clone "https://github.com/pyLexxDramma/pto-drawings.git" $app
          }
          $env:PTO_APP_DIR = $app
          powershell -ExecutionPolicy Bypass -File "$app\scripts\deploy-cloudpub.ps1"
