name: Deploy CloudPub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Pull and publish
        shell: pwsh
        run: |
          Set-Location "D:\PTO\pto-app"
          powershell -ExecutionPolicy Bypass -File ".\scripts\deploy-cloudpub.ps1"
